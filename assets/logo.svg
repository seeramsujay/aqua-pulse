<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030b1e"/>
      <stop offset="100%" stop-color="#0a1936"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <linearGradient id="sonarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00bbf9" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Bathymetric Depth Contour Waves -->
  <path d="M 80 340 Q 180 290 250 330 T 420 320" fill="none" stroke="#3a86ff" stroke-width="3" stroke-opacity="0.4"/>
  <path d="M 80 380 Q 170 330 250 370 T 420 360" fill="none" stroke="#00bbf9" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.3"/>

  <!-- Acoustic Chirp Pulse Concentric Radii -->
  <circle cx="250" cy="210" r="150" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-dasharray="12 16" stroke-opacity="0.4"/>
  <circle cx="250" cy="210" r="105" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="250" cy="210" r="60" fill="none" stroke="#00f5d4" stroke-width="4" filter="url(#glow)"/>

  <!-- Piezoceramic Transducer Emitter Array Core -->
  <circle cx="250" cy="210" r="28" fill="#0d2348" stroke="url(#waveGrad)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="250,192 265,220 235,220" fill="#00f5d4"/>
  <circle cx="250" cy="210" r="6" fill="#ffffff"/>

  <!-- Subsea Hydro-Acoustic Wavefront Beam -->
  <path d="M 230 236 L 150 370 Q 250 400 350 370 L 270 236 Z" fill="url(#sonarGlow)" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
